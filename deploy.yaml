proxy_location: EveryNode

http_options:
  host: 0.0.0.0
  port: 8000

grpc_options:
  port: 9000
  grpc_servicer_functions: [ ]

logging_config:
  encoding: TEXT
  log_level: INFO
  logs_dir: null
  enable_access_log: true
  additional_log_standard_attrs: [ ]

applications:
#  - name: visual
#    route_prefix: /visual
#    import_path: src.visual.analyze:app
#    runtime_env: { }
#    deployments:
#      - name: DiagramAnalyzerTask
#        num_replicas: 1
#        max_ongoing_requests: 1
  - name: ocr
    route_prefix: /ocr
    import_path: src.visual.analyze:app_ocr
    runtime_env: { }
    deployments:
      - name: OCRReaderEasyocr
        num_replicas: 1
        max_ongoing_requests: 1

  - name: det
    route_prefix: /det
    import_path: src.visual.analyze:app_det
    runtime_env: { }
    deployments:
      - name: DiagramNodesDetector
        num_replicas: 1
        max_ongoing_requests: 1

  - name: doc
    route_prefix: /doc
    import_path: src.document:app
    runtime_env: { }
    deployments:
      - name: DocumentProcessor
        num_replicas: 1
        max_ongoing_requests: 1
      - name: DocumentTableProcessor
        num_replicas: 1
        max_ongoing_requests: 1
      - name: PDFProcessorODL
        num_replicas: 1
        max_ongoing_requests: 1
      - name: PDFProcessorDocling
        num_replicas: 1
        max_ongoing_requests: 1
      - name: PDFProcessorDoclingVLM
        num_replicas: 1
        max_ongoing_requests: 1
