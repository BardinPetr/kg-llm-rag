    "rich[jupyter]",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
force-include = { "pyproject.toml" = "pyproject.toml" }
packages = ["src/tasks", "src/db", "src/docproc", "src/document", "src/ededup", "src/kg", "src/load", "src/search", "src/service", "src/utils", "src/validate"]

[tool.setuptools.packages.find]
where = ["src"]
