[project]
name = "diploma"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "faker>=40.4.0",
    "matplotlib>=3.10.8",
    "networkx",
    "numpy>=2.4.2",
    "pandas>=3.0.0",
    "pydot>=4.0.1",
    "pygraphviz>=1.14",
    "scipy>=1.17.0",
    "pydantic (>=2.12.5,<3.0.0)",
    "rich>=14.3.2",
    "iplotx>=1.7.0",
    "rdp>=0.8",
    "tqdm>=4.67.3",
    "ultralytics==8.3.160",
    "torch>=2.10.0",
    "torchvision>=0.25.0",
    "clearml>=2.1.3",
    "comet-ml>=3.56.0",
    "playwright>=1.58.0",
    "yandex-ai-studio-sdk>=0.19.2",
    "dotenv>=0.9.9",
    "xmltodict>=1.0.3",
    "cytoolz>=1.1.0",
    "more-itertools>=10.8.0",
    "loguru>=0.7.3",
    "ray[data,serve]>=2.54.0",
    "daft[ray]>=0.6.14",
    "dagster>=1.12.14",
    "dagster-webserver>=1.12.14",
    "dagster-dg-cli>=1.12.14",
    "pymupdf>=1.27.1",
    "pymupdf4llm>=0.3.4",
    "roboflow>=1.2.14",
    "scikit-learn>=1.8.0",
    "scikit-image>=0.26.0",
    "transformers>=5.2.0",
    "pymupdf-layout>=1.27.1",
    "easyocr>=1.7.2",
    "plotly>=6.5.2",
    "nbformat>=5.10.4",
    "ipykernel>=7.2.0",
    "pyyaml>=6.0.3",
    "docopt>=0.6.2",
    "tensorboardx>=2.6.4",
    "opencv-python>=4.13.0.92",
    "wrapt>=2.1.1",
    "datasets>=4.7.0",
    "albumentations>=2.0.8",
    "kornia>=0.8.2",
    "kornia-rs>=0.1.10",
    "shapely>=2.1.2",
    "sknw>=0.15",
    "bidict>=0.23.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "rich[jupyter]>=14.3.2",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
force-include = { "pyproject.toml" = "pyproject.toml" }

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "diploma"
registry_modules = [
    "diploma.components.*",
]


