[project]
name = "diploma"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "faker>=40.4.0",
    "matplotlib>=3.10.8",
    "networkx",
    "numpy>=2.4.2",
    "pandas>=3.0.0",
    "pydot>=4.0.1",
    "pygraphviz>=1.14",
    "scipy>=1.17.0",
    "pydantic",
    "rich",
    "iplotx>=1.7.0",
    "rdp>=0.8",
    "tqdm",
    "ultralytics==8.3.160",
    "torch>=2.10.0",
    "torchvision>=0.25.0",
    "clearml>=2.1.3",
    "comet-ml>=3.56.0",
    "playwright>=1.58.0",
    "yandex-ai-studio-sdk>=0.19.2",
    "dotenv>=0.9.9",
    "xmltodict>=1.0.3",
    "cytoolz>=1.1.0",
    "more-itertools>=10.8.0",
    "loguru>=0.7.3",
    "ray[data,serve]>=2.54.0",
    "daft[ray]>=0.6.14",
    "dagster>=1.12.14",
    "dagster-webserver>=1.12.14",
    "dagster-dg-cli>=1.12.14",
    "pymupdf>=1.27.1",
    "pymupdf4llm>=0.3.4",
    "roboflow>=1.2.14",
    "scikit-learn>=1.8.0",
    "scikit-image>=0.26.0",
    "transformers",
    "pymupdf-layout>=1.27.1",
    "easyocr>=1.7.2",
    "plotly>=6.5.2",
    "nbformat>=5.10.4",
    "ipykernel>=7.2.0",
    "pyyaml>=6.0.3",
    "docopt>=0.6.2",
    "tensorboardx>=2.6.4",
    "opencv-python>=4.13.0.92",
    "wrapt>=2.1.1",
    "datasets>=4.7.0",
    "albumentations>=2.0.8",
    "kornia>=0.8.2",
    "kornia-rs>=0.1.10",
    "shapely>=2.1.2",
    "sknw>=0.15",
    "bidict>=0.23.1",
    "langchain>=1.2.12",
    "langchain-openrouter>=0.1.0",
    "langchain-huggingface>=1.2.1",
    "langchain-text-splitters>=1.1.1",
    "langchain-community>=0.4.1",
    "langgraph>=1.1.3",
    "olmocr>=0.4.27",
    "opendataloader-pdf>=2.0.2",
    "docling[ocr]>=2.80.0",
    "pydantic-settings>=2.13.1",
    "openai>=2.29.0",
    "langchain-openai>=1.1.11",
    "langsmith>=0.7.20",
    "langgraph-cli[inmem]>=0.4.8",
    "dspy>=3.1.3",
    "pyvis>=0.3.2",
    "fuzzysearch>=0.8.1",
    "neomodel>=6.1.0",
    "umap-learn>=0.5.12",
    "datashader>=0.19.0",
    "bokeh>=3.9.0",
    "holoviews>=1.22.1",
    "colorcet>=3.1.0",
    "cloudpickle>=3.1.2",
    "prefect[aws]>=3.6.27",
    "boto3>=1.42.71",
    "boto3-stubs>=1.42.92",
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "rich[jupyter]",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
force-include = { "pyproject.toml" = "pyproject.toml" }

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "diploma"
registry_modules = [
    "diploma.components.*",
]

[tool.setuptools.packages.find]
where = ["src"]
